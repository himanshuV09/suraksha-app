name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: |
          python -m pip install -r engine/requirements-dev.txt
          cd app; npm ci

      - name: Engine tests
        working-directory: engine
        run: python -m pytest -q

      - name: Frontend type check and build
        working-directory: app
        run: npm run build

      - name: Backend tests
        working-directory: app/src-tauri
        run: cargo test

  release:
    # Installers are built for version tags (v1.0.0, ...).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Build installers
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: suraksha-installers
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
